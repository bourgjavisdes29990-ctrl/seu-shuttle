name: Build Shuttle Widget APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk seu-shuttle-widget.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seu-shuttle-widget
          path: seu-shuttle-widget.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "东大兰台接驳车桌面卡片 v1.0"
          body: |
            ### 🚌 东南大学兰台接驳车 · 原生桌面卡片安装包

            **安装说明：**
            1. 下载下方的 `seu-shuttle-widget.apk` 并在手机上安装。
            2. 回到手机桌面，长按空白处 → 点击「微件 / 卡片」。
            3. 找到「东大接驳车」，将 4×2 卡片拖到桌面即可！

            **特性：**
            - 桌面常驻大卡片，解锁手机即见下一班车
            - 支持「去上课 / 回宿舍」一键切换
            - 自动区分工作日与节假日班次
            - 亮屏自刷新，零后台常驻极度省电
          files: seu-shuttle-widget.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
