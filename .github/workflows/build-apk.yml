name: Build Shuttle Widget APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk seu-shuttle-widget.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seu-shuttle-widget
          path: seu-shuttle-widget.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "东大兰台接驳车桌面卡片 v1.0"
          files: seu-shuttle-widget.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
