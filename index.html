    :root {

      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #3b82f6;
      --primary-light: #60a5fa;
      --success: #22c55e;
      --success-bg: rgba(34,197,94,0.12);
      --warning: #f59e0b;
      --warning-bg: rgba(245,158,11,0.12);
      --error: #ef4444;
      --error-bg: rgba(239,68,68,0.12);
      --accent: #8b5cf6;
      --accent-bg: rgba(139,92,246,0.1);
      --lantai: #f472b6;
      --lantai-bg: rgba(244,114,182,0.15);
      --teaching: #38bdf8;
      --teaching-bg: rgba(56,189,248,0.12);
      --campus: #34d399;
      --campus-bg: rgba(52,211,153,0.12);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* ===== Header ===== */
    .header {
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
      padding: 16px 16px 12px;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .header h1 { font-size:18px; font-weight:700; display:flex; align-items:center; gap:6px; }
    .clock-wrap { text-align:right; }
    .clock { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--primary-light); line-height:1.1; }
    .date-info { font-size:11px; color:var(--text-muted); margin-top:2px; }
    .day-badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:10px; font-weight:600; margin-left:4px; }
    .day-badge.wd { background:var(--success-bg); color:var(--success); }
    .day-badge.we { background:var(--warning-bg); color:var(--warning); }

    /* ===== Main Tabs (三大板块) ===== */
    .main-tabs {
      display:flex; gap:4px; padding:8px 16px;
      background: var(--bg);
      position: sticky; top: 72px; z-index: 90;
      border-bottom: 1px solid var(--border);
    }
    .main-tab {
      flex:1; padding:8px 4px; border-radius:10px;
      border:1.5px solid var(--border); background:var(--card);
      color:var(--text-muted); font-size:12px; font-weight:600;
      text-align:center; cursor:pointer; transition:all 0.2s;
    }
    .main-tab.active { border-color:var(--primary); background:rgba(59,130,246,0.15); color:var(--primary-light); }
    .main-tab .tab-icon { font-size:16px; display:block; margin-bottom:2px; }
    .main-tab.lantai-tab.active { border-color:var(--lantai); background:var(--lantai-bg); color:var(--lantai); }
    .main-tab.campus-tab.active { border-color:var(--campus); background:var(--campus-bg); color:var(--campus); }

    /* ===== Day Type Toggle ===== */
    .day-row { display:flex; gap:6px; padding:6px 16px 2px; }
    .day-btn {
      flex:1; padding:7px 8px; border-radius:10px;
      border:1px solid var(--border); background:rgba(255,255,255,0.03);
      color:var(--text-muted); font-size:12px; font-weight:600;
      text-align:center; cursor:pointer; transition:all 0.2s;
      display:flex; align-items:center; justify-content:center; gap:5px;
    }
    .day-btn.active {
      border-color:var(--primary); background:rgba(59,130,246,0.15); color:var(--primary-light);
    }
    .day-btn .badge-pill {
      font-size:9px; padding:1px 5px; border-radius:6px; background:rgba(255,255,255,0.1);
    }
    .day-btn.active .badge-pill {
      background:rgba(59,130,246,0.3); color:#fff;
    }

    /* ===== Direction Toggle ===== */
    .dir-row { display:flex; gap:6px; padding:10px 16px; }
    .dir-btn {
      flex:1; padding:10px 6px; border-radius:12px;
      border:2px solid var(--border); background:var(--card);
      color:var(--text-muted); font-size:13px; font-weight:600;
      text-align:center; cursor:pointer; transition:all 0.2s; line-height:1.3;
    }
    .dir-btn.active { border-color:var(--primary); background:rgba(59,130,246,0.15); color:var(--primary-light); }
    .dir-btn .arrow { font-size:16px; display:block; margin-bottom:1px; }

    /* ===== Route Filter ===== */
    .filter-row { display:flex; gap:5px; padding:6px 16px; overflow-x:auto; }
    .filter-row::-webkit-scrollbar { display:none; }
    .chip {
      flex-shrink:0; padding:5px 12px; border-radius:16px;
      border:1px solid var(--border); background:var(--card);
      color:var(--text-muted); font-size:11px; font-weight:500;
      cursor:pointer; transition:all 0.2s; white-space:nowrap;
    }
    .chip.active { border-color:var(--primary); background:rgba(59,130,246,0.15); color:var(--primary-light); }
    .chip.teaching.active { border-color:var(--teaching); background:var(--teaching-bg); color:var(--teaching); }

    /* ===== Content ===== */
    .content { padding:0 16px 100px; }

    /* Hero Card */
    .hero {
      background:linear-gradient(135deg, rgba(59,130,246,0.2), rgba(139,92,246,0.15));
      border:1px solid rgba(59,130,246,0.3); border-radius:16px;
      padding:18px; margin:12px 0; position:relative; overflow:hidden;
    }
    .hero.lantai-hero {
      background:linear-gradient(135deg, rgba(244,114,182,0.2), rgba(139,92,246,0.15));
      border-color:rgba(244,114,182,0.3);
    }
    .hero-label { font-size:11px; color:var(--text-muted); letter-spacing:0.5px; margin-bottom:6px; }
    .hero-time { font-size:40px; font-weight:800; color:var(--primary-light); font-variant-numeric:tabular-nums; line-height:1; }
    .hero.lantai-hero .hero-time { color: var(--lantai); }
    .hero-route { font-size:13px; color:var(--text); margin-top:6px; }
    .hero-countdown {
      display:inline-flex; align-items:center; gap:5px; margin-top:8px;
      padding:4px 12px; border-radius:16px; font-size:14px; font-weight:700;
    }
    .hero-countdown.soon { background:var(--error-bg); color:var(--error); }
    .hero-countdown.moderate { background:var(--warning-bg); color:var(--warning); }
    .hero-countdown.plenty { background:var(--success-bg); color:var(--success); }
    .hero-next-hint { margin-top:8px; font-size:11px; color:var(--text-muted); }
    .hero-tag {
      display:inline-block; margin-top:6px; padding:2px 8px; border-radius:8px;
      font-size:10px; font-weight:600;
    }
    .hero-tag.teaching { background:var(--teaching-bg); color:var(--teaching); }
    .hero-tag.regular { background:rgba(148,163,184,0.15); color:var(--text-muted); }

    .no-bus { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px 16px; text-align:center; margin:12px 0; }
    .no-bus .emoji { font-size:36px; margin-bottom:8px; }
    .no-bus .msg { font-size:13px; color:var(--text-muted); line-height:1.5; }

    /* Info banner */
    .info-banner {
      background:var(--accent-bg); border:1px solid rgba(139,92,246,0.2);
      border-radius:10px; padding:10px 14px; margin:8px 0;
      font-size:11px; color:var(--accent); line-height:1.5;
    }

    /* Section */
    .section-title { font-size:12px; font-weight:600; color:var(--text-muted); margin:14px 0 6px; display:flex; align-items:center; gap:5px; }
    .period-div {
      display:flex; align-items:center; gap:8px; margin:12px 0 6px;
      font-size:11px; font-weight:600; color:var(--text-dim);
    }
    .period-div::after { content:''; flex:1; height:1px; background:var(--border); }

    /* Bus Item */
    .bus {
      display:flex; align-items:center; padding:10px 12px; border-radius:10px;
      margin-bottom:4px; border:1px solid var(--border); background:var(--card);
      gap:10px; transition:all 0.15s;
    }
    .bus.passed { opacity:0.3; background:transparent; border-color:transparent; }
    .bus.next { border-color:var(--primary); background:rgba(59,130,246,0.08); box-shadow:0 0 16px rgba(59,130,246,0.08); }
    .bus.next .bus-time { color:var(--primary-light); }
    .bus-time { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; min-width:48px; }
    .bus-info { flex:1; min-width:0; }
    .bus-route { font-size:11px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .bus-tags { display:flex; gap:3px; margin-top:3px; flex-wrap:wrap; }
    .tag { padding:1px 6px; border-radius:6px; font-size:9px; font-weight:600; }
    .tag.teaching { background:var(--teaching-bg); color:var(--teaching); }
    .tag.regular { background:rgba(148,163,184,0.1); color:var(--text-dim); }
    .tag.note-tag { background:var(--warning-bg); color:var(--warning); }
    .bus-status { font-size:11px; font-weight:600; white-space:nowrap; }
    .bus-status.gone { color:var(--text-dim); }
    .bus-status.up { color:var(--success); }
    .bus-status.hot { color:var(--error); animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    /* Tip bar */
    .tip-bar {
      position:fixed; bottom:0; left:0; right:0;
      background:var(--card); border-top:1px solid var(--border);
      padding:8px 16px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0));
      font-size:11px; color:var(--text-muted); text-align:center;
      z-index:50;
    }
    .tip-bar a { color:var(--primary-light); text-decoration:none; }

    /* Hide scrollbar globally on mobile */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
  </style>
</head>

      { time:"08:00", from:"九龙湖", to:"四牌楼", lantai:false },
      { time:"10:10", from:"九龙湖", to:"四牌楼", lantai:false },
      { time:"10:10", from:"九龙湖", to:"丁家桥", lantai:false },
      { time:"12:00", from:"九龙湖", to:"四牌楼", lantai:false },
      { time:"14:00", from:"九龙湖", to:"四牌楼", lantai:false },
      { time:"17:00", from:"九龙湖", to:"四牌楼", lantai:false },
      { time:"17:00", from:"九龙湖", to:"丁家桥", lantai:false },
    ],
  }
};

// Campus bus restricted times
const CAMPUS_RESTRICTED = [
  { start:"09:20", end:"10:00" },
  { start:"11:20", end:"12:00" },
  { start:"13:20", end:"14:00" },
  { start:"15:20", end:"16:00" },
];

// =====================================================================
//  STATE
// =====================================================================
let mainTab = 'lantai';
let currentDay = isWE() ? 'weekend' : 'weekday';
let lantaiDir = 'toSchool'; // toSchool / toHome
let lantaiFilter = 'all';   // all / teaching / regular
let icDir = 'to9';          // to9 / from9

// =====================================================================
//  HELPERS
// =====================================================================
function tm(t) {
  if (!t) return 0;
  if (t.includes('-')) {
    const [start] = t.split('-');
    const [h, m] = start.split(':').map(Number);
    return h * 60 + m;
  }
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function tmEnd(t) {
  if (!t) return 0;
  if (t.includes('-')) {
    const parts = t.split('-');
    const [h, m] = parts[1].split(':').map(Number);
    return h * 60 + m;
  }
  return tm(t);
}
function nowM() { const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function isWE() { const d=new Date().getDay(); return d===0||d===6; }

function setDayType(d) {
  currentDay = d;
  renderSub();
  render();
}

function updateClock() {
  const n=new Date();
  document.getElementById('clock').textContent =
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  const wd=['日','一','二','三','四','五','六'];
  const b = isWE()
    ? '<span class="day-badge we">休息日</span>'
    : '<span class="day-badge wd">工作日</span>';
  document.getElementById('dateInfo').innerHTML =
    `${n.getMonth()+1}月${n.getDate()}日 周${wd[n.getDay()]} ${b}`;
}

function countdownHtml(diff) {
  if (diff <= 0) return '<span class="bus-status gone">已过</span>';
  if (diff <= 10) return `<span class="bus-status hot">${diff}分钟</span>`;
  if (diff <= 30) return `<span class="bus-status up" style="color:var(--warning)">${diff}分钟</span>`;
  return `<span class="bus-status up">${diff}分钟</span>`;
}

function urgency(diff) {
  if (diff <= 3) return { cls:'soon', txt:'⚡ 快跑！' };
  if (diff <= 10) return { cls:'soon', txt:'🏃 抓紧！' };
  if (diff <= 20) return { cls:'moderate', txt:'👌 还来得及' };
  return { cls:'plenty', txt:'☕ 不着急' };
}

function periodEmoji(p) {
  return { '早间':'🌅', '平峰':'☀️', '晚间':'🌙', '上午':'🌅', '中午':'☀️', '下午':'🌇' }[p] || '🕐';
}

// =====================================================================
//  MAIN TAB
// =====================================================================
function setMainTab(tab) {
  mainTab = tab;
  document.querySelectorAll('.main-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  renderSub();
  render();
}

// =====================================================================
//  SUB CONTROLS
// =====================================================================
function renderSub() {
  const el = document.getElementById('subControls');
  if (mainTab === 'lantai') {
    el.innerHTML = `
      <div class="day-row">
        <div class="day-btn ${currentDay==='weekday'?'active':''}" onclick="setDayType('weekday')">
          💼 工作日时刻 ${!isWE()?'<span class="badge-pill">今天</span>':''}
        </div>
        <div class="day-btn ${currentDay==='weekend'?'active':''}" onclick="setDayType('weekend')">
          🏖️ 休息日时刻 ${isWE()?'<span class="badge-pill">今天</span>':''}
        </div>
      </div>
      <div class="dir-row">
        <div class="dir-btn ${lantaiDir==='toSchool'?'active':''}" onclick="setLantaiDir('toSchool')">
          <span class="arrow">→</span>去上课
        </div>
        <div class="dir-btn ${lantaiDir==='toHome'?'active':''}" onclick="setLantaiDir('toHome')">
          <span class="arrow">←</span>回宿舍
        </div>
      </div>
      <div class="filter-row">
        <div class="chip ${lantaiFilter==='all'?'active':''}" onclick="setLantaiFilter('all')">全部班次</div>
        <div class="chip teaching ${lantaiFilter==='teaching'?'active':''}" onclick="setLantaiFilter('teaching')">🏫 直达纪忠楼专线</div>
        <div class="chip ${lantaiFilter==='regular'?'active':''}" onclick="setLantaiFilter('regular')">🔄 仅北门转盘线</div>
      </div>
    `;
  } else if (mainTab === 'intercampus') {
    el.innerHTML = `
      <div class="dir-row">
        <div class="dir-btn ${icDir==='to9'?'active':''}" onclick="setIcDir('to9')">
          <span class="arrow">→</span>去九龙湖
        </div>
        <div class="dir-btn ${icDir==='from9'?'active':''}" onclick="setIcDir('from9')">
          <span class="arrow">←</span>从九龙湖
        </div>
      </div>
    `;
  } else {
    el.innerHTML = `
      <div class="day-row">
        <div class="day-btn ${currentDay==='weekday'?'active':''}" onclick="setDayType('weekday')">
          💼 工作日时刻 ${!isWE()?'<span class="badge-pill">今天</span>':''}
        </div>
        <div class="day-btn ${currentDay==='weekend'?'active':''}" onclick="setDayType('weekend')">
          🏖️ 休息日时刻 ${isWE()?'<span class="badge-pill">今天</span>':''}
        </div>
      </div>
      <div class="info-banner" style="margin:8px 16px;">
        🔄 图书馆北（中央大道）发车，二环循环运行<br>
        早高峰东北门处约5-8分钟一趟，坐满即走
      </div>
    `;
  }
}

function setLantaiDir(d) { lantaiDir=d; renderSub(); render(); }
function setLantaiFilter(f) { lantaiFilter=f; renderSub(); render(); }
function setIcDir(d) { icDir=d; renderSub(); render(); }

// =====================================================================
//  RENDER
// =====================================================================
function render() {
  if (mainTab === 'lantai') renderLantai();
  else if (mainTab === 'campus') renderCampus();
  else renderIC();
}

function renderLantai() {
  const c = document.getElementById('content');
  const now = nowM();
  const dayType = currentDay;
  const isToday = (currentDay === (isWE() ? 'weekend' : 'weekday'));
  let items = LANTAI[dayType][lantaiDir];

  if (lantaiFilter === 'teaching') items = items.filter(i => i.type === 'teaching');
  else if (lantaiFilter === 'regular') items = items.filter(i => i.type === 'regular');

  // Look for active cycle or upcoming buses
  let activeCycle = null;
  if (isToday) {
    activeCycle = items.find(i => i.isCycle && now >= tm(i.time) && now < tmEnd(i.time));
  }

  const next = isToday ? (activeCycle || items.find(i => tm(i.time) > now)) : null;
  let next2 = null;
  if (isToday) {
    if (activeCycle) {
      next2 = items.find(i => !i.isCycle && tm(i.time) > now);
    } else if (next) {
      next2 = items.find(i => i !== next && tm(i.time) > now);
    }
  }

  let html = '';

  // Hero
  if (next) {
    const isCycleRunning = next.isCycle && now >= tm(next.time) && now < tmEnd(next.time);
    const diff = tm(next.time) - now;
    const u = urgency(diff);

    let countdownText = '';
    let countdownCls = u.cls;
    if (isCycleRunning) {
      countdownText = '🔄 早高峰循环发车中（随到随走）';
      countdownCls = 'moderate';
    } else {
      countdownText = `${u.txt} 还有 ${diff} 分钟`;
    }

    html += `
      <div class="hero lantai-hero">
        <div class="hero-label">⏱ ${lantaiDir==='toSchool'?'最近去上课':'最近回宿舍'} · <span style="font-size:11px;opacity:0.85;">${dayType==='weekday'?'工作日':'休息日'}</span></div>
        <div class="hero-time" style="${next.isCycle?'font-size:22px;':''}">${next.isCycle && isCycleRunning ? '🔄 循环发车中' : next.time}</div>
        <div class="hero-route">${next.route}</div>
        <div class="hero-countdown ${countdownCls}">${countdownText}</div>
        ${next.type==='teaching'?'<br><span class="hero-tag teaching">📚 教学专线（到纪忠楼）</span>':''}
        ${next.note?`<br><span class="hero-tag" style="${next.note.includes('不确定')?'background:rgba(239,68,68,0.2);color:#ef4444;':'background:var(--warning-bg);color:var(--warning);'}">⚠️ ${next.note}</span>`:''}
        ${next2?`<div class="hero-next-hint">接下来：${next2.time}（${next2.route}）${next2.note?` · ${next2.note}`:''}</div>`:''}
      </div>
    `;
  } else if (!isToday) {
    const firstBus = items[0];
    html += `
      <div class="hero lantai-hero" style="background:linear-gradient(135deg, rgba(56,189,248,0.15), rgba(99,102,241,0.1));">
        <div class="hero-label">📅 ${dayType==='weekday'?'【工作日】时刻表预览':'【休息日】时刻表预览'}</div>
        <div class="hero-time" style="font-size:22px;margin:6px 0;">${items.length ? `共 ${items.length} 个班次/时段` : '该筛选无班次'}</div>
        <div class="hero-route">${firstBus ? `首班车：${firstBus.time}（${firstBus.route}）` : '节假日无对应路线'}</div>
        <div style="font-size:12px;color:var(--primary-light);margin-top:6px;">👇 可在下方列表查看详细时刻与路线</div>
      </div>
    `;
  } else {
    html += `<div class="no-bus"><div class="emoji">😴</div><div class="msg">今天没有更多班次了<br>明天早点来吧！</div></div>`;
  }

  // 节假日纪忠楼专线特别说明
  if (dayType === 'weekend' && lantaiFilter === 'teaching') {
    if (lantaiDir === 'toHome') {
      html += `
        <div style="background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.25);border-radius:14px;padding:16px;margin:12px 0;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
            <span style="font-size:20px;">ℹ️</span>
            <span style="font-weight:700;color:var(--teaching);font-size:14px;">节假日官方无纪忠楼直达返程专线</span>
          </div>
          <div style="font-size:12px;color:var(--text-muted);line-height:1.6;">
            根据东南大学总务处时刻表，<b>双休日及节假日返程接驳车全部仅由【北门转盘】发车返回兰台</b>，不经停纪忠楼。<br>
            • 如需回宿舍，请点击上方<b>【全部班次】</b>乘坐北门发车班次；<br>
            • 如需查看周一至周五的纪忠楼返程专线时刻，请点击上方<b>【💼 工作日时刻】</b>查看。
          </div>
          <div style="margin-top:12px;display:flex;gap:8px;">
            <button onclick="setDayType('weekday')" style="padding:6px 14px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;">查看工作日返程</button>
            <button onclick="setLantaiFilter('all')" style="padding:6px 14px;background:rgba(255,255,255,0.08);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:12px;cursor:pointer;">查看节假日全部班次</button>
          </div>
        </div>
      `;
    } else {
      html += `
        <div style="background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.25);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:12px;color:var(--text-muted);line-height:1.6;">
          💡 <b>节假日说明</b>：双休日及节假日兰台直达纪忠楼仅 <b>07:40</b> 一班专线。其余时间请乘坐常规线至北门转盘后转乘或步行。如需查看周一至周五的纪忠楼专线，请点击上方<b>【💼 工作日时刻】</b>。
        </div>
      `;
    }
  }

  // List
  html += `<div class="section-title">📋 ${dayType==='weekday'?'工作日':'节假日'} · 全部班次（共 ${items.length} 班/时段）</div>`;
  let lastP = '';
  items.forEach(item => {
    const mStart = tm(item.time);
    const mEnd = tmEnd(item.time);
    const isCycleRunning = item.isCycle && isToday && now >= mStart && now < mEnd;
    const passed = isToday && (item.isCycle ? now >= mEnd : mStart <= now);
    const isN = next && (item === next || (item.isCycle && isCycleRunning));
    const diff = mStart - now;

    if (item.period !== lastP) {
      html += `<div class="period-div">${periodEmoji(item.period)} ${item.period}</div>`;
      lastP = item.period;
    }

    let cls = 'bus'; if(passed)cls+=' passed'; if(isN)cls+=' next';
    let tags = '';
    if(item.type==='teaching') tags+='<span class="tag teaching">📚 教学专线</span>';
    if(item.isCycle) tags+='<span class="tag" style="background:rgba(59,130,246,0.18);color:var(--primary-light)">🔄 循环发车</span>';
    if(item.note) {
      const isWarn = item.note.includes('不确定');
      tags+=`<span class="tag note-tag" style="${isWarn?'background:rgba(239,68,68,0.18);color:#ef4444;font-weight:600;border:1px solid rgba(239,68,68,0.3);':''}">${isWarn?'⚠️ ':''}${item.note}</span>`;
    }

    let statusHtml = '';
    if (!isToday) {
      statusHtml = '<span class="bus-status" style="color:var(--text-dim)">' + (item.isCycle?'循环':'准点') + '</span>';
    } else if (isCycleRunning) {
      statusHtml = '<span class="bus-status up" style="color:var(--teaching);font-weight:700;">循环中</span>';
    } else if (passed) {
      statusHtml = '<span class="bus-status gone">已过</span>';
    } else {
      statusHtml = countdownHtml(diff);
    }

    html += `<div class="${cls}">
      <div class="bus-time" style="${item.isCycle?'font-size:12px;min-width:76px;letter-spacing:-0.5px;font-weight:800;':''}">${item.time}</div>
      <div class="bus-info">
        <div class="bus-route">${item.route}</div>
        <div class="bus-tags">${tags}</div>
      </div>
      ${statusHtml}
    </div>`;
  });
  if (!items.length) {
    if (!(dayType === 'weekend' && lantaiFilter === 'teaching' && lantaiDir === 'toHome')) {
      html += `<div class="no-bus"><div class="emoji">🔍</div><div class="msg">该筛选下没有班次</div></div>`;
    }
  }
  c.innerHTML = html;
}

function renderCampus() {
  const c = document.getElementById('content');
  const now = nowM();
  const dayType = currentDay;
  const isToday = (currentDay === (isWE() ? 'weekend' : 'weekday'));
  const times = CAMPUS_BUS[dayType];
  const next = isToday ? times.find(t => tm(t) > now) : null;
  const next2 = next ? times.find(t => t !== next && tm(t) > now) : null;

  let html = '';
  if (next) {
    const diff = tm(next) - now;
    const u = urgency(diff);
    // Check if restricted
    let restricted = false;
    for (const r of CAMPUS_RESTRICTED) {
      if (tm(next) >= tm(r.start) && tm(next) < tm(r.end)) { restricted = true; break; }
    }
    html += `
      <div class="hero">
        <div class="hero-label">⏱ 下一班校园巴士（图书馆北发车）· <span style="font-size:11px;opacity:0.85;">${dayType==='weekday'?'工作日':'休息日'}</span></div>
        <div class="hero-time">${next}</div>
        <div class="hero-route">图书馆北（中央大道）→ 二环循环</div>
        <div class="hero-countdown ${u.cls}">${u.txt} 还有 ${diff} 分钟</div>
        ${restricted?'<br><span class="hero-tag" style="background:var(--warning-bg);color:var(--warning)">⚠️ 教学区限行时段，改走绕行路线</span>':''}
        ${next2?`<div class="hero-next-hint">再下一班：${next2}</div>`:''}
      </div>
    `;
  } else if (!isToday) {
    html += `
      <div class="hero" style="background:linear-gradient(135deg, rgba(52,211,153,0.15), rgba(59,130,246,0.1));">
        <div class="hero-label">📅 ${dayType==='weekday'?'【工作日】校园巴士预览':'【休息日】校园巴士预览'}</div>
        <div class="hero-time" style="font-size:22px;margin:6px 0;">全天共 ${times.length} 班次</div>
        <div class="hero-route">首班车：${times[0]} · 末班车：${times[times.length-1]}</div>
        <div style="font-size:12px;color:var(--campus);margin-top:6px;">👇 可在下方列表查看完整时刻</div>
      </div>
    `;
  } else {
    html += `<div class="no-bus"><div class="emoji">😴</div><div class="msg">今天没有更多校园巴士了</div></div>`;
  }

  html += `<div class="section-title">📋 ${dayType==='weekday'?'工作日':'节假日'} · 全天班次（共 ${times.length} 班）</div>`;
  let lastH = -1;
  times.forEach(t => {
    const m = tm(t), passed = isToday && m <= now;
    const isN = next && t === next, diff = m - now;
    const h = Math.floor(m / 60);
    if (h !== lastH) {
      html += `<div class="period-div">${h < 12 ? '🌅' : h < 18 ? '☀️' : '🌙'} ${h}:00 时段</div>`;
      lastH = h;
    }
    let restricted = false;
    for (const r of CAMPUS_RESTRICTED) { if (m >= tm(r.start) && m < tm(r.end)) { restricted = true; break; } }
    let cls = 'bus'; if(passed)cls+=' passed'; if(isN)cls+=' next';
    let tags = restricted ? '<span class="tag note-tag">绕行</span>' : '';
    html += `<div class="${cls}">
      <div class="bus-time">${t}</div>
      <div class="bus-info">
        <div class="bus-route">图书馆北 → 二环循环</div>
        <div class="bus-tags">${tags}</div>
      </div>
      ${isToday ? countdownHtml(diff) : '<span class="bus-status" style="color:var(--text-dim)">准点</span>'}
    </div>`;
  });
  c.innerHTML = html;
}

function renderIC() {
  const c = document.getElementById('content');
  const now = nowM();
  const dayType = isWE() ? 'weekend' : 'weekday';
  const items = INTERCAMPUS[icDir][dayType];
  const next = items.find(i => tm(i.time) > now);
  const next2 = next ? items.find(i => i !== next && tm(i.time) > now) : null;

  let html = '';
  if (next) {
    const diff = tm(next.time) - now;
    const u = urgency(diff);
    html += `
      <div class="hero">
        <div class="hero-label">⏱ 最近跨校区大巴</div>
        <div class="hero-time">${next.time}</div>
        <div class="hero-route">${next.from} → ${next.to}</div>
        <div class="hero-countdown ${u.cls}">${u.txt} 还有 ${diff} 分钟</div>
        ${next.lantai?'<br><span class="hero-tag" style="background:var(--lantai-bg);color:var(--lantai)">🏠 经停兰台</span>':''}
        ${next2?`<div class="hero-next-hint">再下一班：${next2.time}（${next2.from}→${next2.to}）${next2.lantai?' · 经停兰台':''}</div>`:''}
      </div>
    `;
  } else {
    html += `<div class="no-bus"><div class="emoji">😴</div><div class="msg">今天没有更多跨校区大巴了</div></div>`;
  }

  html += '<div class="section-title">📋 全部班次</div>';
  items.forEach(item => {
    const m = tm(item.time), passed = m <= now;
    const isN = next && item === next, diff = m - now;
    let cls = 'bus'; if(passed)cls+=' passed'; if(isN)cls+=' next';
    let tags = item.lantai ? '<span class="tag" style="background:var(--lantai-bg);color:var(--lantai)">🏠 兰台</span>' : '';
    html += `<div class="${cls}">
      <div class="bus-time">${item.time}</div>
      <div class="bus-info">
        <div class="bus-route">${item.from} → ${item.to}</div>
        <div class="bus-tags">${tags}</div>
      </div>
      ${countdownHtml(diff)}
    </div>`;
  });
  c.innerHTML = html;
}

// =====================================================================
//  INIT
// =====================================================================
updateClock(); renderSub(); render();
setInterval(() => { updateClock(); render(); }, 15000);

// Register Service Worker for PWA
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
